<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: linear-gradient(135deg, #0891b2 0%, #6366f1 50%, #8b5cf6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Arial', sans-serif;
  }

  .container {
    width: 1024px;
    height: 1024px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  /* Background circles */
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.15;
  }
  .bg-circle-1 { width: 800px; height: 800px; background: white; top: -200px; right: -200px; }
  .bg-circle-2 { width: 600px; height: 600px; background: white; bottom: -150px; left: -150px; }
  .bg-circle-3 { width: 300px; height: 300px; background: #fbbf24; top: 100px; left: 50px; opacity: 0.2; }

  /* Main icon */
  .icon-wrapper {
    position: relative;
    width: 500px;
    height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Outer glow ring */
  .glow-ring {
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 3px solid rgba(255,255,255,0.3);
  }

  .glow-ring-2 {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.2);
  }

  /* Center circle */
  .center-circle {
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 3px solid rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 0 80px rgba(255,255,255,0.2), inset 0 0 80px rgba(255,255,255,0.05);
  }

  /* Chat bubbles */
  .chat-group {
    position: relative;
    width: 240px;
    height: 200px;
  }

  .bubble {
    position: absolute;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }

  .bubble-main {
    width: 180px;
    height: 110px;
    background: white;
    bottom: 0;
    left: 0;
    border-bottom-left-radius: 4px;
  }

  .bubble-secondary {
    width: 130px;
    height: 80px;
    background: rgba(255,255,255,0.85);
    top: 0;
    right: 0;
    border-top-right-radius: 4px;
  }

  /* Chat lines */
  .chat-lines {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    width: 100%;
  }

  .chat-line {
    height: 12px;
    background: linear-gradient(90deg, #0891b2, #6366f1);
    border-radius: 6px;
    opacity: 0.7;
  }

  .chat-line:nth-child(1) { width: 80%; }
  .chat-line:nth-child(2) { width: 60%; }
  .chat-line:nth-child(3) { width: 70%; }

  .chat-line-sm {
    height: 10px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    border-radius: 5px;
    opacity: 0.6;
  }
  .chat-line-sm:nth-child(1) { width: 75%; }
  .chat-line-sm:nth-child(2) { width: 50%; }

  /* Stars/sparkles */
  .sparkle {
    position: absolute;
    color: white;
    font-size: 40px;
    opacity: 0.8;
  }

  /* Bottom text */
  .text-section {
    position: absolute;
    bottom: 100px;
    text-align: center;
    color: white;
  }

  .logo-title {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: -2px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    line-height: 1;
  }

  .logo-title span {
    color: #fbbf24;
  }

  .logo-subtitle {
    font-size: 32px;
    font-weight: 400;
    opacity: 0.9;
    margin-top: 8px;
    letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }

  /* Lightning bolt */
  .lightning {
    position: absolute;
    font-size: 60px;
    top: 80px;
    right: 120px;
    opacity: 0.9;
  }

  /* People icons */
  .people {
    position: absolute;
    top: 80px;
    left: 120px;
    font-size: 50px;
    opacity: 0.85;
  }

  /* Shekel */
  .shekel {
    position: absolute;
    bottom: 200px;
    right: 110px;
    width: 80px;
    height: 80px;
    background: rgba(251,191,36,0.9);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    font-weight: 900;
    color: white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .ai-badge {
    position: absolute;
    bottom: 200px;
    left: 110px;
    background: rgba(251,191,36,0.9);
    border-radius: 20px;
    padding: 10px 24px;
    font-size: 36px;
    font-weight: 900;
    color: white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Background decoration -->
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="bg-circle bg-circle-3"></div>

  <!-- Floating elements -->
  <div class="lightning">⚡</div>
  <div class="people">👥</div>
  <div class="shekel">₪</div>
  <div class="ai-badge">AI</div>

  <!-- Main icon -->
  <div class="icon-wrapper">
    <div class="glow-ring"></div>
    <div class="glow-ring-2"></div>
    <div class="center-circle">
      <div class="chat-group">
        <!-- Main bubble -->
        <div class="bubble bubble-main">
          <div class="chat-lines">
            <div class="chat-line"></div>
            <div class="chat-line"></div>
            <div class="chat-line"></div>
          </div>
        </div>
        <!-- Secondary bubble -->
        <div class="bubble bubble-secondary">
          <div class="chat-lines">
            <div class="chat-line-sm"></div>
            <div class="chat-line-sm"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Text -->
  <div class="text-section">
    <div class="logo-title">ניתוק <span>בקליק</span></div>
    <div class="logo-subtitle">קהילה חכמה • חוסכת כסף</div>
  </div>
</div>
</body>
</html>
